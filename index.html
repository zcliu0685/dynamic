function whitelistPage(){let rows=data.whitelists.filter(w=>(w.name+w.id+w.remark+w.numbers.join('')).toLowerCase().includes(state.search.toLowerCase())&&(!state.filter||state.filterStatus==='全部'||w.load===state.filterStatus));return `<h1 class="page-title">白名单管理</h1><div class="toolbar"><div></div><div class="actions"><input class="field search" id="search" placeholder="输入ID或名称搜索" value="${esc(state.search)}"><button class="btn" data-action="toggle-filter">⚲　过滤</button>${button('＋ 新建白名单','new-whitelist','primary')}</div></div>${state.filter?`<div class="filters"><label>加载状态</label><select class="field" id="filter-status"><option>全部</option><option ${state.filterStatus==='就绪'?'selected':''}>就绪</option><option ${state.filterStatus==='加载中'?'selected':''}>加载中</option></select>${button('重置','reset-filter','light')}</div>`:''}<div class="table-wrap"><table class="grid"><colgroup><col style="width:8%"><col style="width:15%"><col style="width:12%"><col style="width:8%"><col style="width:33%"><col style="width:8%"><col style="width:8%"><col style="width:8%"></colgroup><thead><tr><th>ID</th><th>名称</th><th>创建人/创建时间</th><th>号码数量</th><th>备注</th><th>加载状态</th><th>引用状态</th><th>操作</th></tr></thead><tbody>${rows.map(w=>`<tr><td>${w.id}</td><td>${esc(w.name)}</td><td><span class="avatar" style="display:inline-grid;width:23px;height:23px;font-size:12px">刘</span> ${esc(w.creator)}<div class="muted">${esc(w.time)}</div></td><td>${w.numbers.length}</td><td style="word-break:break-all">${esc(w.remark)}${w.id===11002487?'<div class="small">'+esc(w.numbers.join('　'))+'</div>':''}</td><td>${esc(w.load)}</td><td>${w.used?'已引用':'未引用'}</td><td><span class="inline-actions"><a data-action="view-whitelist" data-id="${w.id}">查看</a><a data-action="edit-whitelist" data-id="${w.id}">编辑</a><a data-action="more-whitelist" data-id="${w.id}">···</a></span></td></tr>`).join('')||'<tr><td colspan="8" class="empty">暂无符合条件的白名单</td></tr>'}</tbody></table></div><div class="pagination">共 ${rows.length} 项　‹　<span class="page-num">1</span>　›　<select class="field"><option>10 条/页</option><option>20 条/页</option></select></div>`}
function filterPopover(){return `<div class="filter-pop" onclick="event.stopPropagation()"><div class="filter-pop-main"><div class="filter-pop-menu"><button data-action="filter-category" data-value="负责人" class="${state.filterCategory==='负责人'?'selected':''}">负责人</button><button data-action="filter-category" data-value="标签" class="${state.filterCategory==='标签'?'selected':''}">标签</button></div><div class="filter-pop-list">${state.filterCategory==='负责人'?`<input class="field" id="owner-search" placeholder="搜索负责人" style="width:100%;height:30px;margin-bottom:10px"><label class="inline-check"><input type="checkbox" id="owner-only" ${state.ownerOnly?'checked':''}>刘佳</label>`:'<div class="empty" style="padding:28px!important">暂无数据</div>'}</div></div><div class="filter-pop-foot"><span>${state.filterCategory==='负责人'?'1':'0'}条数据　已选择${state.ownerOnly?'1':'0'}个过滤条件</span><span>${button('取消','close-filter','light')}${button('重置','reset-dynamic-filter','light')}${button('应用','apply-dynamic-filter','primary')}</span></div></div>`}
function menu(items){return `<div class="dropdown">${items.map(x=>`<button data-action="${x[0]}" ${x[2]||''}>${x[1]}</button>`).join('')}</div>`}
function dynamicPage(){let list=data.modules.filter(m=>(m.id+m.desc).toLowerCase().includes(state.search.toLowerCase())&&(state.scope==='全部'||m.owner==='刘佳')&&(!state.ownerOnly||m.owner==='刘佳'));return `<h1 class="page-title">Kuikly模块列表</h1><div class="toolbar"><div class="segmented"><button data-action="scope-all" class="${state.scope==='全部'?'selected':''}">全部</button><button data-action="scope-mine" class="${state.scope==='我的'?'selected':''}">我的</button></div><div class="actions"><input class="field search" id="search" placeholder="输入名称或描述搜索" value="${esc(state.search)}"><div class="menu-wrap"><button class="btn" data-action="toggle-filter">⚲　过滤</button>${state.filter?filterPopover():''}</div><div class="menu-wrap"><button class="btn" data-action="more-modules">···　更多</button>${state.menu==='global'?menu([['feature-settings','功能开关设置'],['grey-template','灰度批次模板'],['migrate-all','模块迁移']]):''}</div>${button('＋ 新建模块','new-module','primary')}</div></div><div class="table-wrap"><table class="grid"><colgroup><col style="width:31%"><col style="width:10%"><col style="width:14%"><col style="width:17%"><col style="width:16%"><col style="width:12%"></colgroup><thead><tr><th>模块名称</th><th>任务数</th><th>任务状态</th><th>最近发布时间</th><th>负责人/创建时间</th><th>操作</th></tr></thead><tbody>${list.map(m=>`<tr><td><button class="icon-btn" data-action="expand" data-id="${esc(m.id)}">${state.expanded===m.id?'⌄':'›'}</button> <span class="name clickable" data-action="expand" data-id="${esc(m.id)}">${esc(m.id)}</span><div class="sub" style="padding-left:30px">${esc(m.desc)}</div></td><td><span class="badge">▣ ${m.tasks.length}</span></td><td><span class="blue">♙ 审批中 0个</span><br><span class="status-green">◷ 灰度中 ${m.tasks.filter(t=>t.status==='灰度中').length}个</span></td><td class="muted">${esc(m.last)}</td><td><span class="avatar" style="display:inline-grid;width:23px;height:23px;font-size:12px">刘</span> ${esc(m.owner)}<div class="muted">${esc(m.time)}</div></td><td><span class="inline-actions"><a data-action="edit-module" data-id="${esc(m.id)}">编辑</a><span class="menu-wrap"><a data-action="module-menu" data-id="${esc(m.id)}">···</a>${state.menu==='module:'+m.id?menu([['delete-module','删除模块',`data-id="${esc(m.id)}"`],['migrate-module','模块迁移',`data-id="${esc(m.id)}"`]]):''}</span></span></td></tr>${state.expanded===m.id?`<tr><td colspan="6" style="padding:0;border:0">${recordPanel(m)}</td></tr>`:''}`).join('')||'<tr><td colspan="6" class="empty">暂无符合条件的模块</td></tr>'}</tbody></table></div><div class="pagination">共 ${list.length} 项　‹　<span class="page-num">1</span>　›　<select class="field"><option>10 条/页</option><option>20 条/页</option></select></div>`}

function recordPanel(m){let tasks=m.tasks.filter(t=>(!state.recordFilter.status||t.status===state.recordFilter.status)&&(!state.recordFilter.platform||(t.platforms||[t.platform]).includes(state.recordFilter.platform)));return `<div class="record-panel"><div class="table-wrap"><table class="grid"><thead><tr><th style="width:34px"></th><th>发布记录</th><th>任务信息</th><th>下发内容</th><th><span class="menu-wrap">目标产品 <a data-action="record-filter-menu" data-value="platform">⚲</a>${state.recordFilterMenu==='platform'?menu([['set-record-filter','全部',`data-kind="platform" data-value=""`],...['鸿蒙','Android','iOS'].map(x=>['set-record-filter',x,`data-kind="platform" data-value="${x}"`])]):''}</span></th><th>任务条件</th><th><span class="menu-wrap">发布状态 <a data-action="record-filter-menu" data-value="status">⚲</a>${state.recordFilterMenu==='status'?menu([['set-record-filter','全部',`data-kind="status" data-value=""`],...['已停止','灰度中','待发布'].map(x=>['set-record-filter',x,`data-kind="status" data-value="${x}"`])]):''}</span></th><th>最近发布时间</th><th>来源</th><th>创建人</th><th>操作</th></tr></thead><tbody>${tasks.map((t,i)=>`<tr><td>${i===0?`<button class="icon-btn" title="新建任务" data-action="new-task" data-id="${esc(m.id)}">⊕</button>`:''}</td><td><a data-action="detail-task" data-module="${esc(m.id)}" data-record="${t.record}">${t.record}</a></td><td>任务ID：${t.id}<br>模块版本：${t.version}<br>${esc(t.desc)}</td><td>制品版本：${t.artifact}<br>${esc(t.size)}</td><td>${(t.platforms||[t.platform]).map(x=>platformIcon(x)).join(' ')} wego<div class="muted">资源Key：${esc(m.id)}</div></td><td>未设置</td><td>版本1　<span class="${t.status==='已停止'?'status-red':t.status==='待发布'?'blue':'status-green'}">◉ ${esc(t.status)}</span></td><td class="muted">${esc(t.time)}</td><td>来源：网页<br>分支：无</td><td>刘佳<div class="muted">${esc(t.creatorTime||'2026-09-16 15:57:44')}</div></td><td><span class="inline-actions"><a data-action="edit-task" data-module="${esc(m.id)}" data-record="${t.record}">编辑</a><span class="menu-wrap"><a data-action="task-menu" data-module="${esc(m.id)}" data-record="${t.record}">···</a>${state.menu==='task:'+t.record?menu([['copy-task','复制任务',`data-module="${esc(m.id)}" data-record="${t.record}"`],['delete-task-menu','删除任务',`data-module="${esc(m.id)}" data-record="${t.record}"`],['rollback-task','一键回滚',`data-module="${esc(m.id)}" data-record="${t.record}"`]]):''}</span></span></td></tr>`).join('')||`<tr><td><button class="icon-btn" data-action="new-task" data-id="${esc(m.id)}">⊕</button></td><td colspan="10" class="empty">暂无发布记录</td></tr>`}</tbody></table></div></div>`}

function drawer(){let title=state.drawer==='whitelist'?(state.editing?'编辑白名单':'新建白名单'):state.drawer==='module'?(state.editing?'编辑模块':'新建模块'):state.drawer==='task'?(state.editing?.task?'编辑任务　发布记录 '+state.editing.record:'新建任务'):'任务详情　发布记录 '+state.editing.record;return `<div class="shade" data-action="close"></div><section class="drawer ${state.drawer==='detail'?'wide':''}" role="dialog" aria-label="${title}"><div class="drawer-head"><button data-action="close">←</button>${title}</div><div class="drawer-body">${state.drawer==='whitelist'?whitelistForm():state.drawer==='module'?moduleForm():state.drawer==='task'?taskForm():detailView()}</div>${state.drawer==='detail'?'':`<div class="drawer-foot">${button('取 消','close','light')}${button('确 定','save-'+state.drawer,'primary')}</div>`}</section>`}
function whitelistForm(){let w=state.editing||{};return `<div class="form-grid one" style="margin:0 0 26px"><div><label class="req">号码包名称</label><input class="field" id="w-name" placeholder="请输入" value="${esc(w.name)}" style="display:block;width:100%;margin-top:8px"></div><div><label>备注</label><textarea class="field" id="w-remark" maxlength="500" placeholder="请输入" style="display:block;width:100%;margin-top:8px">${esc(w.remark)}</textarea><div class="hint" style="text-align:right">最多 500 字</div></div><div><label class="req">添加号码</label><div class="radio-line"><label><input type="radio" name="w-mode" value="manual" checked>手动输入</label><label><input type="radio" name="w-mode" value="file">文件上传</label></div><textarea class="field" id="w-numbers" placeholder="不同的号码以英文,进行分割" style="display:block;width:100%;min-height:65px">${esc((w.numbers||[]).join(','))}</textarea><div class="hint">文件上传模式可选择本地 TXT / CSV 文件。交互稿仅在浏览器本地解析。</div><input type="file" id="w-file" accept=".txt,.csv" style="display:none;margin-top:9px"></div></div>`}
function moduleForm(){let m=state.editing||{};return `<div class="sectionbar">▣ 基本信息</div><div class="form-grid"><div class="formrow"><label class="req">模块名称</label><input class="field" id="m-name" placeholder="模块名称只能包含字母、数字、下划线、中划线、小数点" value="${esc(m.id)}"></div><div class="formrow"><label class="req">模块描述</label><input class="field" id="m-desc" placeholder="请输入模块描述" value="${esc(m.desc)}"></div><div class="formrow"><label>标签</label><select class="field" id="m-tag"><option>请选择标签</option><option>业务模块</option><option>测试模块</option></select></div><div class="formrow"><label class="req">负责人</label><select class="field" id="m-owner"><option>刘佳</option><option>当前用户</option></select></div><div class="formrow"><label class="req">发布审核人</label><select class="field" id="m-reviewer"><option value="">请选择审核人</option><option ${m.id?'selected':''}>刘佳</option><option>当前用户</option></select></div></div><div class="sectionbar">♧ 绑定资源Key</div><div class="form-grid"><div class="formrow"><label class="req">绑定方式</label><select class="field" id="m-bind"><option value="">请选择产品资源Key</option><option ${m.id?'selected':''}>wego / kuikly_business_album</option><option>wego / kuikly_business_bcg</option><option>wego / kuikly_test</option></select></div><div class="formrow"><label>关联场景</label><select class="field"><option>请选择场景</option><option>微购</option></select></div></div><div class="sectionbar">高级选项</div><div class="form-grid"><div class="formrow"><label>子文件类型 ⓘ</label><input class="field" placeholder="校验解压后的js、css，正则为(\\.js|\\.css)$"></div><div class="formrow"><label>资源包优化 ⓘ</label><select class="field"><option>自动优化</option><option>关闭</option></select></div><div class="formrow"><label>内置资源到APP ⓘ</label><select class="field"><option>不内置</option><option>内置</option></select></div><div class="formrow"><label>批次放量审批 ⓘ</label><select class="field"><option>请选择</option><option>需要审批</option><option>无需审批</option></select></div><div class="formrow"><label>发布分支校验</label><input class="field" placeholder="请输入允许发布的分支名规则"></div><div class="formrow"><label>Debug包默认为体验用户</label><select class="field"><option>关闭</option><option>开启</option></select></div></div>`}
function batchEditor(prefix,values=[50000,100000,250000,1000000,5000000,50000000,100000000],minutes=100){return `<div class="batch-editor" id="${prefix}-editor"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">灰度时长 ⓘ <input class="field" style="width:74px" id="${prefix}-count" type="number" min="1" value="${values.length}"> 批　<input class="field" style="width:84px" id="${prefix}-minutes" type="number" min="1" value="${minutes}"> 分钟/批　<span class="muted small">总时长：${(values.length*minutes/60).toFixed(2)}小时</span>　<a data-action="toggle-batches" data-prefix="${prefix}">收起灰度批次详情⌃</a></div><div id="${prefix}-batches"><p class="small muted">Shiply按照以下规则进行放量，所有批次结束后全量下发，可点击修改每个批次放量上限。</p><table class="grid"><thead><tr><th>批次</th><th>停留时间（分钟）</th><th>放量上限　<select class="field" style="width:125px;height:29px"><option>累计用户数</option><option>覆盖率</option></select></th><th>操作</th></tr></thead><tbody id="${prefix}-rows">${values.map((v,i)=>`<tr><td>${i+1}</td><td class="batch-time">${minutes}</td><td><input class="field batch-limit" type="number" min="1" value="${v}"></td><td><a data-action="remove-batch" data-prefix="${prefix}">删除</a></td></tr>`).join('')}</tbody></table><a data-action="add-batch" data-prefix="${prefix}">＋ 添加批次</a></div></div>`}

function taskForm(){let t=state.editing?.task||state.editing?.copy||{},m=state.editing?.module||data.modules.find(x=>x.id===state.editing?.moduleId);let platforms=t.platforms||[t.platform||'鸿蒙'];let strategy=t.strategy||'灰度发布';return `<div class="sectionbar">▣ 基础信息</div><div class="form-grid"><div class="formrow"><label class="req">任务描述</label><input class="field" id="t-desc" placeholder="请输入任务描述" value="${esc(t.desc)}"></div><div class="formrow"><label>模块版本号</label><input class="field" id="t-version" type="number" min="0" placeholder="请输入模块版本号" value="${t.version??0}"></div><div class="formrow"><label>制品可降级 ⓘ</label><select class="field" id="t-downgrade"><option>开启</option><option>关闭</option></select></div><div></div><div class="formrow" style="grid-column:1/-1"><label class="req">目标产品</label><div class="product-choice-list">${['Android','iOS','鸿蒙'].map(x=>`<label><input type="checkbox" name="platform" value="${x}" ${platforms.includes(x)?'checked':''}>${platformIcon(x)} wego <span class="muted small">资源Key：${esc(m?.id||'')}</span></label>`).join('')}</div></div></div><div class="sectionbar condition-sectionbar"><span class="section-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5z"/></svg>下发条件&关联制品</span><a class="small" data-action="help-condition">ⓘ 查看说明文档</a></div><div class="grey-box task-condition-panel"><div class="mini-tabs">${['Android','iOS','鸿蒙'].map(x=>`<button data-action="product-tab" data-value="${x}" ${platforms.includes(x)?'':'hidden'} class="${(state.productTab||platforms[0])===x?'selected':''}">${platformIcon(x)} wego　<span class="muted small">资源Key：${esc(m?.id||'')}</span></button>`).join('')}</div><div class="condition-top"><label for="t-condition">下发条件</label><select class="field" id="t-condition"><option>自定义条件</option><option>应用于全部</option><option>白名单</option></select></div><div class="condition-builder"><div id="condition-list"><div class="condition-row">${conditionFields()}</div></div><a data-action=" ><label class="inline-check"><input type="checkbox" id="t-schedule" ${t.schedule?'checked':''}>开启</label></div><div id="schedule-field" class="formrow" style="margin-top:10px;${t.schedule?'':'display:none'}"><label>发布时间</label><input class="field" type="datetime-local" id="t-schedule-time" value="${esc(t.scheduleTime||'')}"></div><div class="hint" style="margin:18px 0 0 160px">本交互稿在浏览器本地保存配置，不会提交至 Shiply。</div>`}

function detailView(){let {module:m,task:t}=state.editing;let limits=t.greyLimits||data.greyTemplate?.limits||[50000,100000,250000,1000000,5000000,50000000,100000000],file=`原型制品/${m.id}/release-${t.artifact}.zip`;return `<div class="mini-tabs"><button data-action="detail-tab" data-value="当前版本" class="${state.detailTab==='当前版本'?'selected':''}">当前版本</button><button data-action="detail-tab" data-value="数据统计" class="${state.detailTab==='数据统计'?'selected':''}">数据统计</button><button class="btn light" data-action="config" style="margin-left:auto">查看配置信息</button></div><div class="detail-layout ${state.detailTab==='数据统计'?'stats-layout':''}"><div class="detail-main">${state.detailTab==='数据统计'?statsView():`<div class="sectionbar">▣ 基础信息</div><div class="detail-kv"><div><span>任务ID：</span>${t.id}</div><div><span>目标产品：</span>▣ wego</div><div><span>模块版本号：</span>${t.version}</div><div><span>制品版本：</span>${t.artifact}</div><div><span>制品可降级：</span>是</div><div><span>创建人：</span>刘佳</div><div><span>创建时间：</span>${esc(t.creatorTime||'2026-09-16 15:57:43')}</div><div><span>任务描述：</span>${esc(t.desc)}</div></div><div class="sectionbar">⚲ 下发条件</div><p style="padding:0 24px">默认条件：应用于全部</p><div class="sectionbar">♧ 放量策略</div><p style="padding:0 24px">发布方式：${esc(t.strategy||'灰度发布')}</p><div class="grey-box">Shiply按照以下规则进行放量，所有批次结束后全量下发，可点击修改每个批次放量上限。<br><br>ⓘ 灰度总时长：${(limits.length*(t.batchMinutes||100)/60).toFixed(2)}小时　<a data-action="toggle-grey">收起灰度批次详情⌃</a><table class="grid" style="margin-top:12px"><thead><tr><th>批次</th><th>停留时间(分钟)</th><th>累计用户数</th></tr></thead><tbody>${limits.map((n,i)=>`<tr><td>${i+1}</td><td>${t.batchMinutes||100}</td><td>${n}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="padding:0 20px">定时发布：${t.schedule?'开启':'关闭'}　灰度后策略：${esc(t.postStrategy|| (t.record===1590?'审批全量':'自动全量'))}　全量方式：${esc(t.fullMethod||'立即全量')}</p><div class="sectionbar">▣ 制品信息</div><div class="mini-tabs"><button data-action="artifact-tab" data-value="原始包" class="${state.artifactTab==='原始包'?'selected':''}">原始包</button><button data-action="artifact-tab" data-value="压缩包" class="${state.artifactTab==='压缩包'?'selected':''}">压缩包</button></div><div class="details-box"><div>文件地址：${esc(file)}　<a data-action="copy-artifact" data-value="${esc(file)}">复制</a></div><div>文件大小：${esc(t.size)}</div><div>文件MD5：—</div></div><div class="sectionbar">▣ CI信息</div><div class="details-box">分支：${esc(t.branch||'—')}<br>流水线地址：—<table class="grid" style="margin-top:12px"><thead><tr><th>提交人</th><th>Commit ID</th><th>提交信息</th></tr></thead><tbody><tr><td colspan="3" class="empty">暂无数据</td></tr></tbody></table></div>`}</div><aside class="detail-side"><div class="step">测试体验<div class="small muted">体验名单(${data.whitelists.find(w=>w.id===t.whitelist)?.numbers.length||0})　<a data-action="experience">✎ 编辑</a>　<a data-action="download-experience">↓ 下载</a></div></div><div class="step">审批环节</div><div class="step ${t.status==='已停止'?'stop':''}">发布环节<div class="grey-box ${t.status==='已停止'?'status-red':t.status==='待发布'?'blue':'status-green'}" style="margin:8px 0 0">◉ ${t.status==='待发布'?'待发布':'发布'+esc(t.status)}</div><div class="small muted">最近修改时间：${esc(t.time)}</div></div><div style="margin-top:auto">${button(t.status==='已停止'?'恢复发布':t.status==='待发布'?'开始发布':'停止发布','toggle-publish',t.status==='灰度中'?'danger':'primary')}<br><br>${button('删除任务','delete-task','danger')}</div></aside></div>`}

function modal(){if(state.modal==='experience'){let t=state.editing.task,w=data.whitelists.find(x=>x.id===t.whitelist), nums=w?.numbers||[];return `<div class="shade" data-action="close-modal"></div><div class="modal"><div class="modal-head">体验号码 <button data-action="close-modal">×</button></div><div class="modal-body"><b>添加体验账号 ⓘ</b><div class="radio-line">${['手动输入','文件上传','号码包添加'].map(x=>`<label><input type="radio" name="experience-mode" value="${x}" ${state.experienceMode===x?'checked':''}>${x}</label>`).join('')}</div>${state.experienceMode==='号码包添加'?`<select class="field" id="e-whitelist" style="width:100%;margin:9px 0"><option value="">选择白名单</option>${data.whitelists.map(x=>`<option value="${x.id}" ${x.id===t.whitelist?'selected':''}>${esc(x.name)}（${x.numbers.length}）</option>`).join('')}</select>`:state.experienceMode==='文件上传'?`<input id="e-file" type="file" accept=".txt,.csv" style="margin:12px 0">`:`<textarea id="e-numbers" class="field" style="width:100%;height:80px;padding:10px" placeholder="体验账号为初始化SDK时填入的ID字段，多个账号以英文逗号分隔"></textarea>`}<div style="margin:10px 0">${button('＋ 添加','add-experience','primary')}</div><b>当前体验账号</b><input id="experience-search" class="field" placeholder="请输入名称搜索" style="float:right;width:220px"><div class="table-wrap" style="max-height:250px;overflow:auto;clear:both;padding-top:12px"><table class="grid"><thead><tr><th>序号</th><th>体验号码</th><th>操作</th></tr></thead><tbody>${nums.map((n,i)=>`<tr><td>${i+1}</td><td>${esc(n)}</td><td><a data-action="remove-experience" data-index="${i}">删除</a></td></tr>`).join('')||'<tr><td colspan="3" class="empty">暂无体验号码</td></tr>'}</tbody></table></div><div class="small muted" style="margin-top:12px">共计：${nums.length}，剩余体验号码数：${2000-nums.length}</div></div></div>`}if(state.modal==='feature-settings'){return `<div class="shade" data-action="close-modal"></div><div class="modal" style="width:520px"><div class="modal-head">功能开关设置<button data-action="close-modal">×</button></div><div class="modal-body" style="min-height:95px">启用立即发布审批　ⓘ　<button class="switch ${state.featureApproval?'on':''}" data-action="toggle-feature" role="switch" aria-checked="${state.featureApproval}"></button></div></div>`}
if(state.modal==='grey-template'){let g=data.greyTemplate||{limits:[50000,100000,250000,1000000,5000000,50000000,100000000],minutes:100};return `<div class="shade" data-action="close-modal"></div><div class="modal" style="width:min(920px,calc(100vw - 40px))"><div class="modal-head">灰度批次模板 <span class="small muted" style="margin-right:auto;margin-left:8px">采用灰度发布时默认填充的批次信息</span><button data-action="close-modal">×</button></div><div class="modal-body">${batchEditor('template',g.limits,g.minutes)}</div><div class="drawer-foot">${button('提交','save-grey-template','primary')}${button('取消','close-modal','light')}</div></div>`}
if(state.modal==='migrate'){let mods=data.modules.filter(x=>!state.migrationModuleId||x.id===state.migrationModuleId);return `<div class="shade" data-action="close-modal"></div><div class="modal" style="width:min(760px,calc(100vw - 40px))"><div class="modal-head">模块迁移<button data-action="close-modal">×</button></div><div class="modal-body"><p>将当前环境下所有模块任务复制到目标环境　<span class="envmark">正</span>正式环境</p><div class="actions" style="margin-bottom:14px"><input id="migration-search" class="field" placeholder="请输入" style="flex:1">${button('搜索','migration-search-btn')}</div><div class="formrow" style="margin-bottom:15px"><label>目标环境：</label><select class="field" id="migration-env"><option>默认测试环境 ID: 1</option><option>预发布环境</option></select></div><div class="table-wrap"><table class="grid"><thead><tr><th style="width:45px"></th><th>模块名称</th><th>任务数</th><th>迁移状态</th></tr></thead><tbody>${mods.map(m=>`<tr><td><input type="checkbox" class="migration-check" value="${esc(m.id)}"></td><td>${esc(m.id)}</td><td>${m.tasks.length}</td><td>待迁移</td></tr>`).join('')}</tbody></table></div></div><div class="drawer-foot">${button('取消','close-modal','light')}${button('开始迁移','start-migration','primary')}</div></div>`}
if(state.modal==='confirm-action'){let k=state.pendingAction?.kind,title=k==='delete-module'?'删除模块':k==='rollback-task'?'一键回滚':'删除任务',desc=k==='delete-module'?'确定删除所选模块吗？':k==='rollback-task'?'确定将所选发布任务回滚到停止状态吗？':'确定删除当前发布任务吗？';return `<div class="shade" data-action="close-modal"></div><div class="modal" style="width:480px"><div class="modal-head">${title}<button data-action="close-modal">×</button></div><div class="modal-body">${desc}<div class="small muted" style="margin-top:8px">此操作仅影响浏览器本地交互稿。</div></div><div class="drawer-foot">${button('取消','close-modal','light')}${button('确定','confirm-action','primary')}</div></div>`}
return `<div class="shade" data-action="close-modal"></div><div class="modal" style="width:480px"><div class="modal-head">提示<button data-action="close-modal">×</button></div><div class="modal-body">${esc(state.modal)}</div><div class="drawer-foot">${button('确定','close-modal','primary')}</div></div>`}
function openDrawer(type,editing=null){state.drawer=type;state.editing=editing;state.menu='';state.filter=false;render()}function findTask(el){let m=data.modules.find(x=>x.id===el.dataset.module),t=m?.tasks.find(x=>x.record===Number(el.dataset.record));return m&&t?{module:m,task:t,record:t.record}:null}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id;
if(a.startsWith('tab-')){state.tab=a.slice(4);state.search='';state.filter=false;state.menu='';state.expanded='';render()}
else if(a==='scope-all'||a==='scope-mine'){state.scope=a==='scope-all'?'全部':'我的';render()}
else if(a==='toggle-filter'){state.filter=!state.filter;state.menu='';render()}
else if(a==='filter-category'){state.filterCategory=el.dataset.value;render()}
else if(a==='close-filter'){state.filter=false;render()}else if(a==='apply-dynamic-filter'){state.ownerOnly=$('#owner-only')?.checked||false;state.filter=false;render()}
else if(a==='reset-dynamic-filter'){state.ownerOnly=false;state.filter=false;render()}
else if(a==='reset-filter'){state.filterStatus='全部';state.filter=false;render()}
else if(a==='expand'){state.expanded=state.expanded===id?'':id;state.menu='';render()}
else if(a==='record-filter-menu'){state.recordFilterMenu=state.recordFilterMenu===el.dataset.value?'':el.dataset.value;render()}
else if(a==='set-record-filter'){state.recordFilter[el.dataset.kind]=el.dataset.value;state.recordFilterMenu='';render()}
else if(a==='new-whitelist')openDrawer('whitelist');else if(a==='edit-whitelist'||a==='view-whitelist')openDrawer('whitelist',data.whitelists.find(x=>x.id===Number(id)));
else if(a==='new-module')openDrawer('module');else if(a==='edit-module')openDrawer('module',data.modules.find(x=>x.id===id));
else if(a==='new-task'){state.productTab='鸿蒙';openDrawer('task',{moduleId:id})}else if(a==='edit-task'){let info=findTask(el);state.productTab=info.task.platform;openDrawer('task',info)}else if(a==='detail-task'){state.detailTab='当前版本';openDrawer('detail',findTask(el))}
else if(a==='close'){state.drawer=null;state.editing=null;render()}else if(a==='close-modal'){state.modal=null;state.pendingAction=null;render()}
else if(a==='save-whitelist'){let name=$('#w-name')?.value.trim(),remark=$('#w-remark')?.value.trim(),numbers=($('#w-numbers')?.value||'').split(/[,，\n\s]+/).map(x=>x.trim()).filter(Boolean);if(!name||!numbers.length)return toast('请填写白名单名称和号码');if(state.editing){Object.assign(state.editing,{name,remark,numbers})}else data.whitelists.unshift({id:Math.max(...data.whitelists.map(x=>x.id),11002488)+1,name,remark,numbers,creator:'当前用户',time:now(),load:'就绪',used:false});save();state.drawer=null;toast('白名单已保存')}
else if(a==='save-module'){let name=$('#m-name')?.value.trim(),desc=$('#m-desc')?.value.trim();if(!name||!desc||!$('#m-reviewer')?.value||!$('#m-bind')?.value)return toast('请填写基本信息、审核人和资源Key');if(!/^[a-zA-Z0-9_.-]+$/.test(name))return toast('模块名称仅支持字母、数字、下划线、中划线和小数点');if(data.modules.some(x=>x.id===name&&x!==state.editing))return toast('模块名称已存在');if(state.editing){Object.assign(state.editing,{id:name,desc})}else data.modules.unshift({id:name,desc,owner:$('#m-owner').value,time:now(),last:'未发布',tasks:[]});save();state.drawer=null;toast('模块已保存')}
